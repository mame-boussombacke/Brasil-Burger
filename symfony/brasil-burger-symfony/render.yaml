services:
  - type: web
    name: brasil-burger-symfony
    env: php
    region: frankfurt
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      php bin/console cache:clear
    startCommand: php -S 0.0.0.0:$PORT -t public
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_SECRET
        generateValue: true