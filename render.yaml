services:
  - type: web
    name: brasil-burger
    env: php
    region: ohio  # ou frankfurt, singapore selon votre localisation
    plan: free
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      php bin/console cache:clear --env=prod --no-debug
    startCommand: |
      if [ -z "$RENDER" ]; then
          # Local
          symfony serve
      else
          # Production on Render
          php -S 0.0.0.0:$PORT public/index.php
      fi
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: brasilburger
          property: connectionString
    disk:
      name: brasil-burger-data
      mountPath: /opt/render/project/src/var
      sizeGB: 1